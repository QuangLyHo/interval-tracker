<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cycling Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Chart.js for drawing the graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>

    <header>
      <h1>🚴 Cycling Analytics</h1>
      <p class="subtitle">Training load · Power zones · AI insights</p>
    </header>

    <main>

      <!-- Row 1: stat chips -->
      <section id="stats-row">
        <div class="stat-card">
          <span class="stat-label">Fitness (CTL)</span>
          <span class="stat-value" id="stat-ctl">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Fatigue (ATL)</span>
          <span class="stat-value" id="stat-atl">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Form (TSB)</span>
          <span class="stat-value" id="stat-tsb">—</span>
        </div>
      </section>

      <!-- Row 2: fitness chart -->
      <section class="card">
        <h2>Fitness Trend — last 90 days</h2>
        <canvas id="fitness-chart"></canvas>
      </section>

      <!-- Row 3: power zones -->
      <section class="card">
        <h2>Power Zone Distribution — last 4 weeks</h2>
        <canvas id="zones-chart"></canvas>
      </section>

      <!-- Row 4: AI insight -->
      <section class="card" id="insight-card">
        <h2>🤖 AI Training Insight</h2>
        <p id="insight-text">Loading…</p>
      </section>

    </main>

    <script src="app.js"></script>
  </body>
</html>
